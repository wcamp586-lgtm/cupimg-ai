<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杯具 AI 作图</title>
<style>
  /* warm 纸面 ramp：打样车间世界。chrome 安静，三张成品图是唯一的 moment */
  :root { color-scheme: light;
    --bg:#f7f4ee; --card:#fdfbf7; --raised:#efe9df;
    --hair:rgba(31,27,22,.09);
    --ink:#1f1b16; --sub:#5e554a; --muted:#7b7266;
    --accent:#b45309; --focus:#d97706;
    --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:32px 24px 64px; }
  header { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  h1 { font-size:24px; font-weight:500; margin:0; letter-spacing:-0.01em; }
  .beta { font-size:12px; color:var(--muted); }
  .lead { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .notice { font-size:12px; color:var(--muted); margin:0 0 32px;
            padding-left:10px; border-left:2px solid var(--hair); line-height:1.7; }

  .card { background:var(--card); border:1px solid var(--hair); border-radius:16px;
          padding:24px; margin-bottom:24px; box-shadow:0 1px 2px rgba(31,27,22,.04); }
  .card.tight { padding:20px 24px; }

  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 20px; }
  label { display:block; font-size:13px; color:var(--sub); margin-bottom:6px; }
  input[type=text], input[type=number], input[type=password], input[type=file], select {
    width:100%; padding:10px 12px; border:1px solid var(--hair); border-radius:10px;
    background:#fff; color:var(--ink); font:inherit; font-size:14px; transition:border-color .15s; }
  input::placeholder { color:#b0a89b; }
  input:focus, select:focus { outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(217,119,6,.12); }
  .full { grid-column:1 / -1; }

  button { background:var(--ink); color:#fdfbf7; border:0; border-radius:10px;
           padding:11px 20px; font:inherit; font-size:14px; font-weight:500; cursor:pointer;
           transition:background .15s, opacity .15s; }
  button:hover { background:#2e2921; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* 结果区：图即内容 */
  .state { font-size:14px; font-weight:500; }
  .state.ok { color:var(--ok); } .state.warn { color:var(--accent); } .state.bad { color:var(--bad); }
  .bar { height:4px; background:var(--raised); border-radius:2px; overflow:hidden; margin:16px 0; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s cubic-bezier(0.22,1,0.36,1); }
  .imgs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .imgs figure { margin:0; }
  .imgs img { width:100%; border-radius:10px; display:block; background:#fff;
              box-shadow:0 1px 2px rgba(31,27,22,.06); }
  .dlrow { margin-top:20px; }
  .dlrow a.main { display:inline-block; background:var(--ink); color:#fdfbf7;
                  padding:11px 20px; border-radius:10px; font-size:14px; font-weight:500; }
  .dlrow a.main:hover { background:#2e2921; text-decoration:none; }
  .dlrow a.sub { font-size:13px; color:var(--sub); }
  pre { background:#141415; color:#c9c5bd; border-radius:12px; padding:16px; font-size:12px; line-height:1.6;
        max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all; margin:20px 0 0;
        font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
  @media (max-width:640px){ .grid,.imgs { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>杯具 AI 作图</h1><span class="beta">内测</span></header>
  <p class="lead">上传一张定稿商品图，输出 1688 主图 / 场景图 / 详情图与 CDR 可编辑 SVG。</p>
  <p class="notice">产物为 AI 生成合成内容，仅供人工评审，勿直接上架；上传图片剥离 EXIF，生成记录留档存证。</p>

  <div class="card tight" id="gate">
    <div class="row">
      <input type="password" id="code" placeholder="访问口令" style="max-width:280px">
      <button id="btnLogin">进入</button>
      <span class="hint" id="gateHint"></span>
    </div>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <form id="form">
        <div class="grid">
          <div><label>商品图</label><input type="file" id="image" accept="image/*" required></div>
          <div><label>SKU</label><input type="text" id="sku" required placeholder="CUP-001"></div>
          <div><label>商品名称</label><input type="text" id="name" required placeholder="三饮儿童保温杯"></div>
          <div><label>材质</label><input type="text" id="material" required placeholder="316L 不锈钢"></div>
          <div><label>容量 (ml)</label><input type="number" id="capacity_ml" required min="1" placeholder="550"></div>
          <div><label>颜色</label><input type="text" id="color" required placeholder="蓝黄"></div>
          <div><label>尺寸 (mm)</label><input type="text" id="dimensions_mm" placeholder="75×75×145"></div>
          <div><label>Logo 文字</label><input type="text" id="logo_text" placeholder="无则留空"></div>
          <div><label>品牌</label><input type="text" id="brand"></div>
          <div><label>把手</label><select id="has_handle"><option value="false">无</option><option value="true">有</option></select></div>
          <div class="full"><label>结构说明</label><input type="text" id="shape_note" placeholder="三饮盖带提环、杯身卡通印花…"></div>
        </div>
        <div class="row" style="margin-top:24px">
          <button id="btnSubmit" type="submit">开始生成</button>
          <span class="hint">约 1–2 分钟，同一时间一个任务</span>
        </div>
      </form>
    </div>

    <div class="card" id="result" style="display:none">
      <div class="row">
        <span class="state" id="stateText">排队中</span>
        <span class="hint" id="delivery"></span>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="imgs" id="imgs"></div>
      <div class="row dlrow" id="dlRow" hidden>
        <a class="main" id="dl" href="#">下载全部（ZIP）</a>
        <a class="sub" id="svg" href="#">单独下载 SVG</a>
      </div>
      <pre id="log"></pre>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let jobId = null, timer = null;

async function login() {
  const code = $("code").value;
  $("gateHint").textContent = "…";
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"},
                                        body: JSON.stringify({code})});
    if (!r.ok) throw new Error((await r.json()).detail || "口令错误");
    $("gate").style.display = "none"; $("main").style.display = "block";
  } catch (e) { $("gateHint").textContent = e.message; }
}
$("btnLogin").onclick = login;
$("code").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

(async () => {
  try { const r = await fetch("/api/jobs/__probe__"); if (r.status !== 401) { $("gate").style.display="none"; $("main").style.display="block"; } } catch (_) {}
})();

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData();
  const f = $("image").files[0];
  if (!f) return alert("请先选择图片");
  fd.append("image", f);
  ["sku","name","material","capacity_ml","color","dimensions_mm","logo_text","brand","shape_note","has_handle"]
    .forEach(k => fd.append(k, $(k).value));
  $("btnSubmit").disabled = true; $("btnSubmit").textContent = "提交中…";
  try {
    const r = await fetch("/api/jobs", {method:"POST", body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "提交失败");
    jobId = d.id;
    $("result").style.display = "block";
    $("stateText").textContent = "排队中";
    $("delivery").textContent = "前面 " + d.queue_ahead + " 个";
    $("result").scrollIntoView({behavior:"smooth", block:"nearest"});
    timer = setInterval(poll, 2000); poll();
  } catch (err) {
    alert(err.message); $("btnSubmit").disabled = false; $("btnSubmit").textContent = "开始生成";
  }
};

async function poll() {
  if (!jobId) return;
  try {
    const r = await fetch("/api/jobs/" + jobId);
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    const done = d.phase === "done" || d.phase === "failed";
    $("stateText").textContent = d.phase === "done" ? "已完成" : d.phase === "failed" ? "失败" : "生成中";
    $("stateText").className = "state " + (d.phase === "done" ? "ok" : d.phase === "failed" ? "bad" : "warn");
    $("bar").style.width = (done ? 100 : Math.min(95, (d.step || 0) * 10)) + "%";
    $("log").textContent = (d.log || []).join("\n");
    $("log").scrollTop = $("log").scrollHeight;
    if (d.delivery_state) {
      const cls = d.delivery_state === "READY" ? "ok" : "warn";
      $("delivery").innerHTML = "<span class='state " + cls + "'>" + d.delivery_state + "</span>" +
        (d.delivery_reason ? " · " + d.delivery_reason : "") + (d.error ? " · " + d.error : "");
    }
    if (d.assets && d.assets.length) {
      $("imgs").innerHTML = d.assets.filter(n => n.endsWith(".png")).map(n =>
        "<figure><img src='/api/jobs/" + jobId + "/asset/" + n + "' alt='" + n + "'></figure>").join("");
      $("dlRow").hidden = false;
      $("dl").href = "/api/jobs/" + jobId + "/download";
      $("svg").href = "/api/jobs/" + jobId + "/asset/design.svg";
    }
    if (done) { clearInterval(timer); $("btnSubmit").disabled = false; $("btnSubmit").textContent = "再生成一张"; }
  } catch (e) { $("log").textContent += "\n[poll error] " + e.message; }
}
</script>
</body>
</html>
