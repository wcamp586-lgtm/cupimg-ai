<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杯具 AI 作图 · 内测</title>
<style>
  :root { color-scheme: light; --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --ink:#1c2026;
          --sub:#6b7280; --brand:#2563eb; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:28px 18px 60px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { font-size:22px; margin:0; letter-spacing:.2px; }
  .tag { font-size:12px; color:var(--warn); background:#fff7ed; border:1px solid #fed7aa;
         padding:2px 9px; border-radius:999px; }
  .lead { color:var(--sub); font-size:13px; margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:20px; margin-bottom:16px; box-shadow:0 1px 2px rgba(16,24,40,.03); }
  .card h2 { font-size:15px; margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; }
  label { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  input[type=text], input[type=number], input[type=password], input[type=file], select {
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
    background:#fff; color:var(--ink); font:inherit; font-size:14px; }
  input:focus, select:focus { outline:2px solid #bfdbfe; border-color:var(--brand); }
  .full { grid-column:1 / -1; }
  button { background:var(--brand); color:#fff; border:0; border-radius:7px;
           padding:10px 18px; font:inherit; font-size:14px; cursor:pointer; }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  .ghost { background:#fff; color:var(--brand); border:1px solid #bfdbfe; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--sub); }
  .warnbox { background:#fffbeb; border:1px solid #fde68a; color:#78350f;
             padding:10px 12px; border-radius:8px; font-size:12.5px; margin-bottom:16px; }
  pre { background:#0f172a; color:#d1fae5; border-radius:8px; padding:12px; font-size:11.5px;
        line-height:1.5; max-height:230px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .imgs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .imgs figure { margin:0; }
  .imgs img { width:100%; border:1px solid var(--line); border-radius:8px; display:block; background:#fff; }
  .imgs figcaption { font-size:12px; color:var(--sub); text-align:center; margin-top:5px; }
  .state { font-size:13px; font-weight:600; }
  .state.ok { color:var(--ok); } .state.warn { color:var(--warn); } .state.bad { color:var(--bad); }
  .bar { height:6px; background:#e5e7eb; border-radius:99px; overflow:hidden; margin:12px 0; }
  .bar > i { display:block; height:100%; width:0; background:var(--brand); transition:width .4s; }
  a { color:var(--brand); }
  @media (max-width:640px){ .grid,.imgs { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>杯具 AI 作图</h1><span class="tag">内测 · 请勿上架</span></header>
  <p class="lead">上传定稿商品图 → AI 图生图重渲染场景并自动校验商品外观一致性 → 输出 1688 主图（原图直通）/ 场景图 / 详情图 + CDR 可编辑 SVG。</p>

  <div class="warnbox">
    <strong>使用边界</strong>：本页供受邀者小范围体验，产物为 AI 生成合成内容，已写入显式/隐式标识。
    <strong>杯子还原度尚未验收，成品仅供人工评审，禁止直接上架 1688。</strong>
    上传图片会剥离 EXIF（含 GPS）；所有生成记录与成本均留档存证。
  </div>

  <div class="card" id="gate">
    <h2>访问口令</h2>
    <div class="row">
      <input type="password" id="code" placeholder="请输入邀请口令" style="max-width:260px">
      <button id="btnLogin">进入</button>
      <span class="hint" id="gateHint"></span>
    </div>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <h2>提交一张定稿商品图</h2>
      <form id="form">
        <div class="grid">
          <div><label>商品图片（JPG / PNG，≤15MB）*</label><input type="file" id="image" accept="image/*" required></div>
          <div><label>SKU 编号 *（字母数字 - _）</label><input type="text" id="sku" required placeholder="CUP-001"></div>
          <div><label>商品名称 *</label><input type="text" id="name" required placeholder="三饮儿童保温杯"></div>
          <div><label>材质 *</label><input type="text" id="material" required placeholder="316L 不锈钢"></div>
          <div><label>容量 ml *</label><input type="number" id="capacity_ml" required min="1" placeholder="550"></div>
          <div><label>颜色 *</label><input type="text" id="color" required placeholder="蓝黄"></div>
          <div><label>尺寸 mm</label><input type="text" id="dimensions_mm" placeholder="75×75×145"></div>
          <div><label>Logo 文字</label><input type="text" id="logo_text" placeholder="没有就留空"></div>
          <div><label>品牌</label><input type="text" id="brand"></div>
          <div><label>有无把手</label><select id="has_handle"><option value="false">无</option><option value="true">有</option></select></div>
          <div class="full"><label>异形 / 结构说明</label><input type="text" id="shape_note" placeholder="三饮盖带提环、杯身卡通印花…"></div>
        </div>
        <div class="row" style="margin-top:16px">
          <button id="btnSubmit" type="submit">开始生成</button>
          <span class="hint">一次约 1–2 分钟；同一时间只跑一个任务，请耐心等</span>
        </div>
      </form>
    </div>

    <div class="card" id="result" style="display:none">
      <h2>任务状态 <span class="state" id="stateText">排队中</span></h2>
      <div class="bar"><i id="bar"></i></div>
      <p class="hint" id="delivery"></p>
      <div class="imgs" id="imgs"></div>
      <div class="row" style="margin-top:14px" id="dlRow" hidden>
        <a class="ghost" id="dl" href="#" style="border:1px solid #bfdbfe;padding:10px 16px;border-radius:7px;text-decoration:none">下载全部（ZIP）</a>
        <a id="svg" href="#" style="font-size:12px">单独下载可编辑 SVG</a>
      </div>
      <pre id="log"></pre>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let jobId = null, timer = null;

async function login() {
  const code = $("code").value;
  $("gateHint").textContent = "…";
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"},
                                        body: JSON.stringify({code})});
    if (!r.ok) throw new Error((await r.json()).detail || "口令错误");
    $("gate").style.display = "none"; $("main").style.display = "block";
  } catch (e) { $("gateHint").textContent = e.message; }
}
$("btnLogin").onclick = login;
$("code").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

(async () => {
  try { const r = await fetch("/api/jobs/__probe__"); if (r.status !== 401) { $("gate").style.display="none"; $("main").style.display="block"; } } catch (_) {}
})();

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData();
  const f = $("image").files[0];
  if (!f) return alert("请先选择图片");
  fd.append("image", f);
  ["sku","name","material","capacity_ml","color","dimensions_mm","logo_text","brand","shape_note","has_handle"]
    .forEach(k => fd.append(k, $(k).value));
  $("btnSubmit").disabled = true; $("btnSubmit").textContent = "提交中…";
  try {
    const r = await fetch("/api/jobs", {method:"POST", body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "提交失败");
    jobId = d.id;
    $("result").style.display = "block";
    $("stateText").textContent = "排队中（前面 " + d.queue_ahead + " 个）";
    $("result").scrollIntoView({behavior:"smooth", block:"nearest"});
    timer = setInterval(poll, 2000); poll();
  } catch (err) {
    alert(err.message); $("btnSubmit").disabled = false; $("btnSubmit").textContent = "开始生成";
  }
};

async function poll() {
  if (!jobId) return;
  try {
    const r = await fetch("/api/jobs/" + jobId);
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    const done = d.phase === "done" || d.phase === "failed";
    $("stateText").textContent = d.phase === "done" ? "已完成" : d.phase === "failed" ? "失败" : "生成中…";
    $("stateText").className = "state " + (d.phase === "done" ? "ok" : d.phase === "failed" ? "bad" : "warn");
    $("bar").style.width = (done ? 100 : Math.min(95, (d.step || 0) * 10)) + "%";
    $("log").textContent = (d.log || []).join("\n");
    $("log").scrollTop = $("log").scrollHeight;
    if (d.delivery_state) {
      const cls = d.delivery_state === "READY" ? "ok" : "warn";
      $("delivery").innerHTML = "交付态：<span class='state " + cls + "'>" + d.delivery_state + "</span> · " +
        (d.delivery_reason || "") + (d.error ? " · " + d.error : "");
    }
    if (d.assets && d.assets.length) {
      const names = { "main_white.png":"白底主图", "scene.png":"场景图", "detail.png":"详情图", "design.svg":"CDR 可编辑 SVG" };
      $("imgs").innerHTML = d.assets.filter(n => n.endsWith(".png")).map(n =>
        "<figure><img src='/api/jobs/" + jobId + "/asset/" + n + "' alt='" + n + "'>" +
        "<figcaption>" + (names[n] || n) + "</figcaption></figure>").join("");
      $("dlRow").hidden = false;
      $("dl").href = "/api/jobs/" + jobId + "/download";
      $("svg").href = "/api/jobs/" + jobId + "/asset/design.svg";
    }
    if (done) { clearInterval(timer); $("btnSubmit").disabled = false; $("btnSubmit").textContent = "再生成一张"; }
  } catch (e) { $("log").textContent += "\n[poll error] " + e.message; }
}
</script>
</body>
</html>
